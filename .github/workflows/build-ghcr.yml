name: build-containers

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    branches: ['main']

jobs:
  api:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      docker_image: ${{ steps.prepare.outputs.docker_image }}
      version: ${{ steps.prepare.outputs.version }}

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: dvgamerr-app
      IMAGE_FILE: Dockerfile
      IMAGE_NAME: waka-personal
      PLATFORMS: linux/amd64,linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare 🔰
        id: prepare
        run: |
          echo "docker_image=${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "buildx_args=--platform $PLATFORMS \
            --build-arg VERSION=${VERSION} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --tag ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/$IMAGE_NAME:$VERSION --file $IMAGE_FILE ." >> $GITHUB_OUTPUT

      - name: Set up QEMU 🧩
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx 📐
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }} 🔍
        if: success() && !contains(github.event_name, 'pull_request')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Push 📌
        run: docker buildx build --output "type=image,push=${{ !contains(github.event_name, 'pull_request') }}" ${{ steps.prepare.outputs.buildx_args }}

  deploy:
    runs-on: self-hosted
    needs: [api]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: read
    env:
      CONTAINER_NAME: waka-personal
      IMAGE_OWNER: dvgamerr-app
      DEPLOY_PLATFORM: linux/arm64

    steps:
      - name: Create GitHub Release 🎉
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            🐳 **Docker Image:**
            - `${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}`

            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull new image
        run: |
          container stop ${{ env.CONTAINER_NAME }} || true
          container delete ${{ env.CONTAINER_NAME }} || true
          container image delete ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }} || true
          container image pull ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}

      - name: Start new container
        # Secrets go through the environment and are quoted, so characters such as
        # & ? $ in a connection string cannot split or alter the shell command.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
        run: |
          container rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          container run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --cpus 1 --memory 512M \
            -e "DATABASE_URL=${DATABASE_URL}" \
            -e "APP_API_KEY=${APP_API_KEY}" \
            -e "APP_TIMEZONE=${APP_TIMEZONE}" \
            -p 3002:8080 \
            ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}

      # แจ้ง Discord หลัง rollout สำเร็จ — sender `kube <ชื่อแอป>` · แจ้งไม่ได้ต้องไม่ทำให้ deploy ที่สำเร็จแล้วล้ม
      - name: Notify Discord (rolled out)
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOTIFY_APP: ${{ env.CONTAINER_NAME }}
          NOTIFY_IMAGE: ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}
        run: |
          test -n "$DISCORD_WEBHOOK" || { echo '::warning::DISCORD_WEBHOOK is empty, skip alert'; exit 0; }
          payload=$(printf '{"username":"kube %s","content":"<:ok:1042489844619804682> Rolled out \140%s\140","allowed_mentions":{"parse":[]}}' "$NOTIFY_APP" "$NOTIFY_IMAGE")
          curl --silent --show-error --max-time 15 -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_WEBHOOK"

  # build หรือ deploy ล้มก็แจ้ง — deploy ถูกข้ามเมื่อ build ล้ม จึงต้องแยกเป็น job ของมันเอง
  notify-failure:
    runs-on: ubuntu-24.04-arm
    needs: [api, deploy]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.api.result == 'failure' || needs.deploy.result == 'failure') }}
    permissions: {}

    steps:
      - name: Notify Discord (failed)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_RESULT: ${{ needs.api.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$DISCORD_WEBHOOK" || { echo '::warning::DISCORD_WEBHOOK is empty, cannot notify'; exit 0; }
          stage=deploy
          if [ "$BUILD_RESULT" = failure ]; then stage=build; fi
          payload=$(printf '{"username":"kube waka-personal","content":"<:fai:1065521737896300604><:led:1065521734096257024> %s failed — <%s>","allowed_mentions":{"parse":[]}}' "$stage" "$RUN_URL")
          curl --silent --show-error --max-time 15 -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_WEBHOOK" || true
