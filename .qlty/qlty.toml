config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "gofmt"

[[plugin]]
name = "golangci-lint"
mode = "comment"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier", "prettier-plugin-astro", "prettier-plugin-tailwindcss"]

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Baseline: the existing GHCR build/deploy workflow predates this check.
# Its zizmor/actionlint findings are tracked as separate hardening work.
[[exclude]]
plugins = ["zizmor", "actionlint"]
file_patterns = [".github/workflows/build-ghcr.yml"]

# Baseline: pre-existing golangci-lint findings (errcheck, funlen, cyclop,
# gocritic). New files are still linted; clear these as separate work.
[[exclude]]
plugins = ["golangci-lint"]
file_patterns = [
  "internal/http/app.go",
  "internal/http/app_integration_test.go",
  "internal/http/app_test.go",
  "internal/service/dashboard.go",
  "internal/service/query.go",
  "internal/service/resume.go",
]
